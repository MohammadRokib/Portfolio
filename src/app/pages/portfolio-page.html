<h2>Portfolio</h2>

@for (project of projects; track project.title) {
  <article>
    <h3>{{ project.title }}</h3>
    <p>{{ project.description }}</p>
    <ul>
      @for (tech of project.tech; track tech) {
        <li>{{ tech }}</li>
      }
    </ul>
    @if (project.link) {
      <a [href]="project.link" target="_blank" rel="noopener">View on Github</a>
    }
  </article>
}
